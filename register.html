<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inscription artiste | Bedonabedo Distribution</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="index.html">BEDONABEDO <span>DISTRIBUTION</span></a>
      <h1>Créer un compte artiste</h1>
      <p class="description">Commencez votre inscription gratuitement. Prototype front-end simulé.</p>
      <form onsubmit="demoRegister(event)">
        <div class="two">
          <label>Nom complet
            <input id="register-full-name" name="full_name" type="text" placeholder="Nom complet" required>
          </label>
          <label>Nom d'artiste
            <input id="register-artist-name" name="artist_name" type="text" placeholder="Nom d'artiste" required>
          </label>
        </div>
        <label>Email
          <input id="register-email" name="email" type="email" placeholder="votre@email.com" required>
        </label>
        <label>Pays
          <input id="register-country" name="country" type="text" placeholder="France" required>
        </label>
        <div class="two">
          <label>Mot de passe
            <input id="register-password" name="password" type="password" placeholder="••••••••" minlength="6" required>
          </label>
          <label>Confirmation du mot de passe
            <input id="register-confirm-password" name="confirm_password" type="password" placeholder="••••••••" minlength="6" required>
          </label>
        </div>
        <label class="small"><input type="checkbox" required> J'accepte que ceci soit un prototype simulé.</label>
        <button class="btn" type="submit">Créer mon compte</button>
      </form>
      <p class="small">Déjà inscrit ? <a href="login.html">Se connecter</a></p>
      <p class="small"><a href="index.html">Retour à l'accueil</a></p>
      <p id="msg" class="small"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
