<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connexion artiste | Bedonabedo Distribution</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="brand" href="index.html">BEDONABEDO <span>DISTRIBUTION</span></a>
      <h1>Connexion artiste</h1>
      <p class="description">Accédez à votre espace prototype pour gérer vos sorties et vos revenus.</p>
      <form onsubmit="demoLogin(event)">
        <label>Email
          <input id="login-email" name="email" type="email" placeholder="votre@email.com" required>
        </label>
        <label>Mot de passe
          <input id="login-password" name="password" type="password" placeholder="••••••••" required>
        </label>
        <button class="btn" type="submit">Se connecter</button>
      </form>
      <p class="small">Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
      <p class="small"><a href="index.html">Retour à l'accueil</a></p>
      <p id="msg" class="small"></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
