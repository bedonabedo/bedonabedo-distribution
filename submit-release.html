<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Soumettre une sortie | Bedonabedo Distribution</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="index.html">BEDONABEDO <span>DISTRIBUTION</span></a>
      <nav>
        <a href="dashboard.html">⌂ Tableau de bord</a>
        <a href="releases.html">♫ Mes sorties</a>
        <a class="active" href="submit-release.html">＋ Soumettre une sortie</a>
        <a href="earnings.html">€ Mes revenus</a>
        <a href="content-id.html">▶ Content ID</a>
        <a href="login.html">↩ Déconnexion</a>
      </nav>
    </aside>
    <main class="dash">
      <div class="top-bar">
        <div>
          <p class="small">SOUMETTRE UNE SORTIE</p>
          <h1>Formulaire de sortie</h1>
          <p class="lead">Ajoutez les informations essentielles de votre prochaine publication.</p>
        </div>
      </div>
      <section class="panel form">
        <form onsubmit="demoSubmit(event)">
          <div class="two">
            <label>Nom de l'artiste<input type="text" placeholder="Nom de l'artiste" required></label>
            <label>Titre de la sortie<input type="text" placeholder="Nom du single, EP ou album" required></label>
          </div>
          <div class="two">
            <label>Type de sortie
              <select required>
                <option>Single</option>
                <option>EP</option>
                <option>Album</option>
              </select>
            </label>
            <label>Genre musical<input type="text" placeholder="Afro, Hip-Hop, Pop..." required></label>
          </div>
          <div class="two">
            <label>Date de sortie<input type="date" required></label>
            <label>Pochette (JPG/PNG)<input type="file" accept="image/png,image/jpeg"></label>
          </div>
          <div class="two">
            <label>Fichier audio (MP3/WAV)<input type="file" accept="audio/mpeg,audio/wav"></label>
            <label>Compositeur<input type="text" placeholder="Nom du compositeur"></label>
          </div>
          <div class="two">
            <label>Auteur<input type="text" placeholder="Nom de l'auteur"></label>
            <label>Producteur<input type="text" placeholder="Nom du producteur"></label>
          </div>
          <label>Copyright<input type="text" placeholder="© 2026 Bedonabedo Music"></label>
          <label>Informations supplémentaires<textarea placeholder="Notes sur la sortie, mentions, éditions..."></textarea></label>
          <label class="small"><input type="checkbox" required> Je confirme que cette soumission est un prototype simulé.</label>
          <button class="btn" type="submit">Soumettre</button>
          <p id="msg" class="small"></p>
        </form>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
